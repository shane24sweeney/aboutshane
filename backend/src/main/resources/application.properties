server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.main.banner-mode=off

# Set by the SAM template in AWS.
app.contact.table-name=${CONTACT_TABLE_NAME:aboutshane-contact-messages}
app.contact.sender=${CONTACT_SENDER:noreply@selenium-automation.com}
# No default: the recipient comes only from the stack's ContactRecipientEmail parameter, so the
# app fails to start rather than mail a stale address, and the address stays out of the repo.
app.contact.recipient=${CONTACT_RECIPIENT}

# Omit absent optional fields (e.g. contractVia) from JSON responses.
spring.jackson.default-property-inclusion=non_null
