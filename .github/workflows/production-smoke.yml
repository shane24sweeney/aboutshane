name: Production smoke

# Read-only checks that the live site and contact API are up. Never submits the form.
on:
  schedule:
    - cron: '17 11 * * *' # daily, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:smoke
        env:
          SKIP_WEBSERVER: '1'
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: production-smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # The request behind every button, under light load. Defaults stay under the API's 2 req/s throttle.
  load:
    name: Load (JMeter button clicks)
    needs: smoke
    runs-on: ubuntu-latest
    env:
      JMETER_VERSION: 5.6.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v5
        id: jmeter-cache
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}
      - if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          base=https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-$JMETER_VERSION.tgz
          curl -fsSLO "$base"
          curl -fsSLO "$base.sha512"
          sha512sum -c "apache-jmeter-$JMETER_VERSION.tgz.sha512"
          tar -xzf "apache-jmeter-$JMETER_VERSION.tgz"
      - run: echo "$PWD/apache-jmeter-$JMETER_VERSION/bin" >> "$GITHUB_PATH"
      - run: npm run test:load
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: jmeter-report
          path: |
            jmeter/results
            jmeter.log
          retention-days: 14
