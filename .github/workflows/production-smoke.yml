name: Production smoke

# Read-only checks that the live site and contact API are up. Never submits the form.
on:
  schedule:
    - cron: '17 11 * * *' # daily, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=production
        env:
          SKIP_WEBSERVER: '1'
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: production-smoke-report
          path: playwright-report
          retention-days: 14
