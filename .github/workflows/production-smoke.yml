name: Daily tests and report

# Every morning, after every merge to master, and by hand (run it after each deploy): UI and API
# tests with code coverage, regression (desktop and 5 phones), read-only smoke checks on the live
# site, and the JMeter load test. Then the quality report for the whole project goes to GitHub
# Pages, so the report, its email and the site's Test Metrics tab show the latest run. The
# summary email goes out only for the morning run and runs started by hand.
# Never submits the contact form.
on:
  schedule:
    - cron: '17 11 * * *' # daily, 11:17 UTC
  push:
    branches: [master]
  workflow_dispatch:

# A newer run replaces one still in progress, so the published report is always the latest.
concurrency:
  group: daily-tests-and-report
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: UI unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ui-report
          path: |
            test-results/unit.json
            coverage
          retention-days: 14

  api:
    name: API tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: api-report
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          retention-days: 14

  regression:
    name: Regression (every browser, phone and tablet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox chrome msedge
      - run: npm run test:regression:all
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: regression-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:smoke
        env:
          SKIP_WEBSERVER: '1'
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: production-smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # The request behind every button, under light load. Defaults stay under the API's 2 req/s throttle.
  load:
    name: Load (JMeter button clicks)
    # After smoke so the two don't share the API's throttle; runs even when smoke fails.
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      JMETER_VERSION: 5.6.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v5
        id: jmeter-cache
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}
      - if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          base=https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-$JMETER_VERSION.tgz
          curl -fsSLO "$base"
          curl -fsSLO "$base.sha512"
          sha512sum -c "apache-jmeter-$JMETER_VERSION.tgz.sha512"
          tar -xzf "apache-jmeter-$JMETER_VERSION.tgz"
      - run: echo "$PWD/apache-jmeter-$JMETER_VERSION/bin" >> "$GITHUB_PATH"
      - run: npm run test:load
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: jmeter-report
          path: |
            tests/jmeter/results
            jmeter.log
          retention-days: 14

  # Builds the dashboard and the email from whatever the three jobs above produced.
  report:
    name: Build report
    needs: [ui, api, regression, smoke, load]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Playwright draws the donut chart image for the email.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ui-report
          path: reports/ui
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: api-report
          path: reports/api
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: regression-report
          path: reports/regression
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: production-smoke-report
          path: reports/smoke
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: jmeter-report
          path: reports/jmeter
      - run: node scripts/test-report/delivery.mjs "$GITHUB_REPOSITORY" reports/delivery.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/test-report/build.mjs reports site
      # Visitors tab: the API's response times from CloudWatch, then Google Analytics. Both skip
      # quietly until set up (REPORT_ROLE_ARN and API_ID variables, GA_SERVICE_ACCOUNT secret).
      - uses: aws-actions/configure-aws-credentials@v6
        if: ${{ vars.REPORT_ROLE_ARN != '' && vars.API_ID != '' }}
        continue-on-error: true
        with:
          role-to-assume: ${{ vars.REPORT_ROLE_ARN }}
          aws-region: us-east-1
      - name: API response times (CloudWatch, last 30 days)
        if: ${{ vars.REPORT_ROLE_ARN != '' && vars.API_ID != '' }}
        continue-on-error: true
        env:
          API_ID: ${{ vars.API_ID }}
        run: |
          start=$(date -u -d '30 days ago' +%FT%TZ); end=$(date -u +%FT%TZ)
          # One datapoint per day (CloudWatch splits longer periods anyway): requests are the sum
          # of the days, and each percentile is the days' values weighted by their requests.
          aws cloudwatch get-metric-statistics --namespace AWS/ApiGateway --dimensions "Name=ApiId,Value=$API_ID" \
            --start-time "$start" --end-time "$end" --period 86400 --metric-name Latency \
            --statistics SampleCount --extended-statistics p50 p90 p99 --output json > reports/api-latency-daily.json
          jq -f scripts/analytics/api-latency.jq reports/api-latency-daily.json > reports/api-latency.json
          cat reports/api-latency.json
      - name: Visitors from Google Analytics
        env:
          GA_SERVICE_ACCOUNT: ${{ secrets.GA_SERVICE_ACCOUNT }}
          GA_PROPERTY_ID: '565419707'
        run: node scripts/analytics/export.mjs site reports/api-latency.json
      - run: echo "Dashboard at https://shane24sweeney.github.io/aboutshane/" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/upload-artifact@v7
        with:
          name: report-email
          path: |
            reports/email.html
            reports/email-subject.txt
            reports/email-chart.png
          retention-days: 14

  pages:
    name: Publish to GitHub Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Sends after Pages so the email's link opens today's report. Skipped until the
  # REPORT_ROLE_ARN variable and REPORT_EMAIL secret are set (see tests/README.md).
  email:
    name: Email report
    needs: [report, pages]
    if: ${{ !cancelled() && needs.report.result == 'success' && vars.REPORT_ROLE_ARN != '' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: report-email
          path: email
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.REPORT_ROLE_ARN }}
          aws-region: us-east-1
      - name: Send with SES
        env:
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: |
          node scripts/test-report/send-email.mjs email message.json
          aws sesv2 send-email \
            --from-email-address "Daily quality report <noreply@selenium-automation.com>" \
            --destination "ToAddresses=$REPORT_EMAIL" \
            --content file://message.json
