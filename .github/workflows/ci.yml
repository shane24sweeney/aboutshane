name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B verify
        working-directory: backend

  infrastructure:
    name: Infrastructure (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install cfn-lint
      - run: cfn-lint infra/template.yaml

  e2e:
    name: End-to-end (Playwright, desktop + Android + iPhone)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:regression
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # Not a required check: it runs on every push and PR so a browser-specific break is visible,
  # but a flaky third-party browser download can't block a merge.
  cross-browser:
    name: Cross-browser (Chrome, Edge, Firefox, Safari, tablets, newer phones)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/build
      - run: npx playwright install --with-deps chromium webkit firefox chrome msedge
      - run: npm run test:browsers
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cross-browser-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # Not a required check (yet): fails when UI coverage, unit and browser tests together, drops below
  # scripts/coverage/thresholds.json. The API's minimum is enforced by `mvn verify` in the Backend job.
  coverage:
    name: UI coverage (unit + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:coverage
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:coverage:browser
      - run: npm run test:coverage
      - run: npm run coverage:merge
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ui-coverage
          path: coverage-combined
          retention-days: 14
