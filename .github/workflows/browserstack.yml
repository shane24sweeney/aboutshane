name: BrowserStack mobile

# Runs the local Playwright suite on the real devices in browserstack.yml, against this commit's
# build served through BrowserStack Local. The contact API is mocked, so nothing sends email.
# Manual until the BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY secrets are set; then add a
# push or schedule trigger here if you want it automatic.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devices:
    name: Real devices (BrowserStack)
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_BUILD_NAME: aboutshane-mobile-${{ github.run_number }}
    steps:
      - name: Check BrowserStack credentials
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "::error::Add the BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY repository secrets first."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:browserstack
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browserstack-report
          path: |
            playwright-report
            test-results
            log
          retention-days: 14
