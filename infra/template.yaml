AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS infrastructure for the AboutShane React frontend and Spring Boot contact API.

Parameters:
  ProjectName:
    Type: String
    Default: aboutshane
    AllowedPattern: '[a-z0-9-]+'
  FrontendCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:647276285325:certificate/6688db3c-3e6f-450c-873c-1800cc539cc9
  FrontendDomainName:
    Type: String
    Default: selenium-automation.com
  FrontendWwwDomainName:
    Type: String
    Default: www.selenium-automation.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z17MA9T0X7H7PX
    Description: Route 53 zone for FrontendDomainName; SES DKIM records are added here.
  # No default, so the address stays out of this public repo. Pass it on the first deploy with
  # --parameter-overrides ContactRecipientEmail=...; later deploys reuse the stack's current value.
  ContactRecipientEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be an email address.
    Description: Where contact-form notifications are sent.
  GitHubRepository:
    Type: String
    Default: shane24sweeney/aboutshane
    Description: owner/repo whose master-branch workflows may send the daily test-report email.

Globals:
  Function:
    Runtime: java25
    MemorySize: 1024
    Timeout: 30

Resources:
  # ---------- Frontend: S3 + CloudFront ----------

  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-s3-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Serves each pre-rendered page from <page>/index.html (written by scripts/prerender.mjs, so
  # tools that don't run JavaScript still get the page's text) and index.html for any other
  # client-side route. Unlike custom error responses, this leaves real 403/404 responses
  # (including API errors) untouched.
  SpaRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-spa-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve pre-rendered pages, and /index.html for other extensionless paths
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var PAGES = ['/home', '/about', '/contact', '/resume', '/testimonials', '/education', '/charity', '/running', '/metrics', '/visitors'];
        function handler(event) {
          var request = event.request;
          var path = request.uri.length > 1 ? request.uri.replace(/\/$/, '') : request.uri;
          if (PAGES.indexOf(path) !== -1) {
            request.uri = path + '/index.html';
          } else if (request.uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} frontend'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases:
          - !Ref FrontendDomainName
          - !Ref FrontendWwwDomainName
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: {}
          - Id: BackendApiOrigin
            DomainName: !Sub '${BackendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRoutingFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # Page content: cached at the edge per the API's Cache-Control (5 minutes), so most
          # navigation clicks never reach Lambda.
          - PathPattern: /api/content/*
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
          # Read-only API calls: cached at the edge for as long as the API's Cache-Control says
          # (status 1 minute, search 5 minutes per query, visitors 10 minutes, the résumé PDF an
          # hour), so repeat calls
          # don't reach API Gateway or Lambda. Other methods are refused here (403).
          - PathPattern: /api/status
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            CachePolicyId: !Ref ApiCachePolicy
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
          - PathPattern: /api/search
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            CachePolicyId: !Ref ApiCachePolicy
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
          - PathPattern: /api/visitors
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            CachePolicyId: !Ref ApiCachePolicy
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
          - PathPattern: /api/resume.pdf
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            CachePolicyId: !Ref ApiCachePolicy
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
          - PathPattern: /api/*
            TargetOriginId: BackendApiOrigin
            ViewerProtocolPolicy: https-only
            Compress: true
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
        ViewerCertificate:
          AcmCertificateArn: !Ref FrontendCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub '${FrontendBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  # ---------- Contact API: Lambda + HTTP API + DynamoDB + SES ----------

  ContactMessagesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-contact-messages'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # Sending domain, verified through Easy DKIM records in Route 53.
  SesDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref FrontendDomainName

  SesDkimRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !GetAtt SesDomainIdentity.DkimDNSTokenName1
          Type: CNAME
          TTL: '1800'
          ResourceRecords:
            - !GetAtt SesDomainIdentity.DkimDNSTokenValue1
        - Name: !GetAtt SesDomainIdentity.DkimDNSTokenName2
          Type: CNAME
          TTL: '1800'
          ResourceRecords:
            - !GetAtt SesDomainIdentity.DkimDNSTokenValue2
        - Name: !GetAtt SesDomainIdentity.DkimDNSTokenName3
          Type: CNAME
          TTL: '1800'
          ResourceRecords:
            - !GetAtt SesDomainIdentity.DkimDNSTokenValue3

  # While the account is in the SES sandbox, the recipient must be verified too.
  # Creating this sends a verification link to the address.
  SesRecipientIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref ContactRecipientEmail

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-backend'
      RetentionInDays: 30

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-backend'
      CodeUri: ../backend
      Handler: com.aboutshane.contactapi.StreamLambdaHandler::handleRequest
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      LoggingConfig:
        LogGroup: !Ref BackendLogGroup
      Environment:
        Variables:
          CONTACT_TABLE_NAME: !Ref ContactMessagesTable
          CONTACT_SENDER: !Sub 'noreply@${FrontendDomainName}'
          CONTACT_RECIPIENT: !Ref ContactRecipientEmail
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ContactMessagesTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${FrontendDomainName}'
                - !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${ContactRecipientEmail}'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
    Metadata:
      BuildMethod: makefile

  # ---------- Daily test report email (GitHub Actions, no stored keys) ----------
  # GitHub's OIDC tokens let the daily workflow on master assume ReportEmailRole for a few minutes.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # Can only send email from the site's domain to the contact address; nothing else.
  ReportEmailRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-report-email'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/master'
      Policies:
        - PolicyName: send-report-email
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The Visitors tab shows the API's response times, read from CloudWatch. Metric
              # reads can't be limited to one resource, but they are read-only.
              - Effect: Allow
                Action: cloudwatch:GetMetricStatistics
                Resource: '*'
              # The report is sent as raw MIME (the chart is attached), which SES checks as SendRawEmail.
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${FrontendDomainName}'
                  - !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${ContactRecipientEmail}'

  # Edge caching for the read-only API calls above. Unlike Managed-CachingOptimized it keeps
  # nothing the API doesn't mark cacheable (DefaultTTL 0), so an error is never held for a day,
  # and it keys search results on the query. Cache policies are free.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ProjectName}-api-cache'
        Comment: Caches read-only API responses for as long as their Cache-Control allows
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
              - q

  BackendApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Account-wide guard against form spam and runaway costs; excess requests get 429.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 2

Outputs:
  FrontendBucketName:
    Description: S3 bucket for the React build
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution ID for cache invalidation
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Description: CloudFront URL for the frontend
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  BackendFunctionName:
    Description: Lambda function name for the backend
    Value: !Ref BackendFunction
  BackendUrl:
    Description: HTTP API URL for the backend (the site reaches it through CloudFront at /api/*)
    Value: !Sub 'https://${BackendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  ReportEmailRoleArn:
    Description: Role the daily test-report workflow assumes to send its email (GitHub variable REPORT_ROLE_ARN)
    Value: !GetAtt ReportEmailRole.Arn
  ContactMessagesTableName:
    Description: DynamoDB table holding contact-form messages
    Value: !Ref ContactMessagesTable
